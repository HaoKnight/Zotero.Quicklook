<vbox
  id="zotero-quicklook-preferences"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  onload="window.ZoteroQuickLookPrefs.init()"
>
  <groupbox>
    <label>
      <html:h2>Set QuickLook</html:h2>
    </label>
    <description> 设置用于预览的 QuickLook.exe 程序路径。 </description>
    <hbox align="center" style="margin-top: 8px">
      <label
        id="zotero-quicklook-path-label"
        value="QuickLook路径"
        style="min-width: 90px; margin-right: 5px"
      />
      <html:input
        id="zotero-quicklook-executable-path"
        type="text"
        style="flex: 1; min-width: 25em; margin-right: 8px"
      />
      <html:button
        id="zotero-quicklook-browse-button"
        type="button"
        style="min-width: 96px"
      >
        选择文件
      </html:button>
    </hbox>
    <description>
      Zotero-Quicklook 版本: v1.2.0 Build 2026.04.27 H-Knight
    </description>
  </groupbox>
</vbox>
